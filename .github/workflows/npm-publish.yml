name: Publish npm

on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Publish version, for example 5.4.0, v5.4.0, or npm-v5.4.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    environment: npm publish

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify release source before build
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/release-source.mjs npm --write-env

      - name: Check npm version availability
        id: npm_version
        shell: bash
        run: |
          set +e
          npm view "cartridge-system@${PUBLISH_VERSION}" version --json > npm-version.json 2> npm-view-error.log
          status=$?
          set -e

          if [[ "${status}" -eq 0 ]]; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
            echo "cartridge-system@${PUBLISH_VERSION} already exists. Skipping npm publish."
            exit 0
          fi

          if grep -q "E404" npm-view-error.log; then
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
            echo "cartridge-system@${PUBLISH_VERSION} is not published yet."
            exit 0
          fi

          cat npm-view-error.log >&2
          exit "${status}"

      - name: Install dependencies
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm ci

      - name: Run lint
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm run lint

      - name: Run tests
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm test

      - name: Build
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm run build

      - name: Type check
        if: steps.npm_version.outputs.already_published != 'true'
        run: npx tsc --noEmit

      - name: Pack dry-run
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm pack --dry-run --json

      - name: Recheck release source before publication
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/release-source.mjs npm

      - name: Publish to npm
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm publish

      - name: Verify exact published source and tarball
        run: node scripts/verify-npm-publication.mjs
