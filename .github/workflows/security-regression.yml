name: Security regression (three surfaces)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
        id: install
      - run: npm test
      - run: npm run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npx tsc --noEmit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Build MCP and VS Code bundles
        id: build_mcp
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Build Desktop main, preload and renderer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run desktop:build
      - name: Exercise packaged MCP stdio servers
        if: ${{ !cancelled() && steps.build_mcp.outcome == 'success' }}
        run: node scripts/security-mcp-smoke.mjs
      - name: Exercise complete npm prepublication gate without publishing
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run prepublishOnly
      - name: Package VSIX without publishing
        id: package_vsix
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.install.outcome == 'success' }}
        run: npm run package
      - name: Build Windows installer without publishing
        id: package_desktop
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.install.outcome == 'success' }}
        run: npm run desktop:dist -- --publish never
      - name: Verify VSIX package and record exact source
        if: ${{ success() && runner.os == 'Linux' && steps.package_vsix.outcome == 'success' }}
        env:
          PREPUBLICATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-prepublication-artifact.mjs vsix
      - name: Verify installer product version and record exact source
        if: ${{ success() && runner.os == 'Windows' && steps.package_desktop.outcome == 'success' }}
        shell: pwsh
        env:
          PREPUBLICATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $file = Get-Item -LiteralPath "release/desktop/Cartridge Desktop Console Setup $version.exe"
          $env:PREPUBLICATION_PRODUCT_VERSION = $file.VersionInfo.ProductVersion
          node scripts/verify-prepublication-artifact.mjs desktop
      - name: Preserve verified VSIX package evidence
        if: ${{ success() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublication-${{ runner.os }}-${{ env.PREPUBLICATION_VERSION }}-${{ github.event.pull_request.head.sha }}
          path: prepublication-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve Windows artifact index
        if: ${{ success() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublication-Windows-index-${{ env.PREPUBLICATION_VERSION }}-${{ github.event.pull_request.head.sha }}
          path: prepublication-segments/index/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve Windows artifact part 01
        if: ${{ success() && runner.os == 'Windows' && fromJSON(env.PREPUBLICATION_PART_COUNT || '0') >= 1 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublication-Windows-part-01-${{ env.PREPUBLICATION_VERSION }}-${{ github.event.pull_request.head.sha }}
          path: prepublication-segments/part-01/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve Windows artifact part 02
        if: ${{ success() && runner.os == 'Windows' && fromJSON(env.PREPUBLICATION_PART_COUNT || '0') >= 2 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublication-Windows-part-02-${{ env.PREPUBLICATION_VERSION }}-${{ github.event.pull_request.head.sha }}
          path: prepublication-segments/part-02/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve Windows artifact part 03
        if: ${{ success() && runner.os == 'Windows' && fromJSON(env.PREPUBLICATION_PART_COUNT || '0') >= 3 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublication-Windows-part-03-${{ env.PREPUBLICATION_VERSION }}-${{ github.event.pull_request.head.sha }}
          path: prepublication-segments/part-03/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve Windows artifact part 04
        if: ${{ success() && runner.os == 'Windows' && fromJSON(env.PREPUBLICATION_PART_COUNT || '0') >= 4 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublication-Windows-part-04-${{ env.PREPUBLICATION_VERSION }}-${{ github.event.pull_request.head.sha }}
          path: prepublication-segments/part-04/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve Windows artifact part 05
        if: ${{ success() && runner.os == 'Windows' && fromJSON(env.PREPUBLICATION_PART_COUNT || '0') >= 5 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublication-Windows-part-05-${{ env.PREPUBLICATION_VERSION }}-${{ github.event.pull_request.head.sha }}
          path: prepublication-segments/part-05/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve Windows artifact part 06
        if: ${{ success() && runner.os == 'Windows' && fromJSON(env.PREPUBLICATION_PART_COUNT || '0') >= 6 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublication-Windows-part-06-${{ env.PREPUBLICATION_VERSION }}-${{ github.event.pull_request.head.sha }}
          path: prepublication-segments/part-06/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve Windows artifact part 07
        if: ${{ success() && runner.os == 'Windows' && fromJSON(env.PREPUBLICATION_PART_COUNT || '0') >= 7 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublication-Windows-part-07-${{ env.PREPUBLICATION_VERSION }}-${{ github.event.pull_request.head.sha }}
          path: prepublication-segments/part-07/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve Windows artifact part 08
        if: ${{ success() && runner.os == 'Windows' && fromJSON(env.PREPUBLICATION_PART_COUNT || '0') >= 8 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublication-Windows-part-08-${{ env.PREPUBLICATION_VERSION }}-${{ github.event.pull_request.head.sha }}
          path: prepublication-segments/part-08/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  release_preflight:
    name: Read-only release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Check post-publication verifier syntax
        run: node --check scripts/verify-npm-publication.mjs
      - name: Inspect public npm versions and dependency audit detail
        run: node scripts/release-readiness-check.mjs
      - name: Exercise verifier against the existing published release
        run: PUBLISH_VERSION=5.5.4 GITHUB_SHA=659f2e92da1b22d9162460995b861c006846dfc7 node scripts/verify-npm-publication.mjs
