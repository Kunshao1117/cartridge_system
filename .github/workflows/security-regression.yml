name: Security regression (three surfaces)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Build MCP and VS Code bundles
        run: npm run build
      - name: Build Desktop main, preload and renderer
        run: npm run desktop:build
      - name: Exercise packaged MCP stdio servers
        run: node scripts/security-mcp-smoke.mjs
